<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Plan</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('workout-planner-theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Workout planner</p>
          <h1>Progression Calendar</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
          <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
          <span class="theme-toggle-label">Dark</span>
        </button>
      </header>

      <section class="panel collapsible-section" id="tracker-panel">
        <button class="section-toggle" type="button" aria-expanded="true">
          <span>Movement tracker</span>
          <span class="toggle-indicator">−</span>
        </button>
        <div class="section-content">
          <div id="activities-list" class="activities-list"></div>
        </div>
      </section>

      <main class="layout">
        <section class="panel collapsible-section" id="planner-panel">
          <button class="section-toggle" type="button" aria-expanded="true">
            <span>Add a movement</span>
            <span class="toggle-indicator">−</span>
          </button>
          <div class="section-content">
            <form id="activity-form">
              <label>
                Exercise
                <input id="exercise-name" type="text" placeholder="pushups" required />
              </label>

              <div class="two-col">
                <label>
                  Current sets
                  <input id="current-sets" type="number" min="1" step="1" value="2" required />
                </label>
                <label>
                  Current reps
                  <input id="current-reps" type="number" min="1" step="1" value="10" required />
                </label>
              </div>

              <div class="two-col">
                <label>
                  Target date
                  <input id="target-date" type="date" required />
                </label>
                <label>
                  Target sets
                  <input id="target-sets" type="number" min="1" step="1" value="5" required />
                </label>
              </div>

              <label>
                Target reps
                <input id="target-reps" type="number" min="1" step="1" value="30" required />
              </label>

              <button type="submit" class="primary-btn">Add plan</button>
            </form>
          </div>
        </section>

        <section class="panel collapsible-section" id="plan-panel">
          <button class="section-toggle" type="button" aria-expanded="true">
            <span id="selected-date-label">Today</span>
            <span class="toggle-indicator">−</span>
          </button>
          <div class="section-content">
            <div id="today-plan" class="plan-list"></div>
          </div>
        </section>
      </main>

      <section class="panel collapsible-section" id="calendar-panel">
        <button class="section-toggle" type="button" aria-expanded="true">
          <span>Calendar</span>
          <span class="toggle-indicator">−</span>
        </button>
        <div class="section-content">
          <div class="calendar-toolbar">
            <button id="prev-month" class="ghost-btn" type="button">◀</button>
            <h2 id="month-label">Month</h2>
            <button id="next-month" class="ghost-btn" type="button">▶</button>
          </div>

          <div class="weekday-row">
            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
